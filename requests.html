<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoboLab | Requests</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark"><div class="container">
<a class="navbar-brand fw-bold" href="index.html">🤖 RoboLab</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li><li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li><li class="nav-item"><a class="nav-link" href="inventory.html">Inventory</a></li><li class="nav-item"><a class="nav-link" href="team.html">Team</a></li><li class="nav-item"><a class="nav-link active" href="requests.html">Requests</a></li>
</ul></div></div></nav>
<main class="container py-5">
<div class="section-heading"><span class="eyebrow">EQUIPMENT REQUEST</span><h1>Request Lab Equipment</h1><p>Submit a request using the frontend form.</p></div>
<div class="row justify-content-center"><div class="col-lg-8">
<div class="content-card">
<form onsubmit="return requestSubmitted()">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Name</label><input class="form-control" type="text" required></div>
<div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" required></div>
<div class="col-md-6"><label class="form-label">Project</label><input class="form-control" type="text" placeholder="e.g. Navicane" required></div>
<div class="col-md-6"><label class="form-label">Component</label><select class="form-select" required><option value="">Choose...</option><option>HC-SR04</option><option>Arduino Uno</option><option>Servo Motor</option><option>HC-05</option><option>Raspberry Pi Pico 2W</option></select></div>
<div class="col-md-6"><label class="form-label">Quantity</label><input class="form-control" type="number" min="1" required></div>
<div class="col-md-6"><label class="form-label">Required Date</label><input class="form-control" type="date" required></div>
<div class="col-12"><label class="form-label">Purpose</label><textarea class="form-control" rows="4" required></textarea></div>
<div class="col-12"><button class="btn btn-primary" type="submit">Submit Request</button></div>
</div>
</form>
</div>
</div></div>
</main>
<footer class="footer"><div class="container text-center"><p class="mb-0">RoboLab Management System • Frontend Version 1</p></div></footer>
<script src="js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
